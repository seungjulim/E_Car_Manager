<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-car-manage 와이어프레임</title>
<style>
:root{
  --bg:#eef0f3; --surface:#fff; --soft:#f5f6f8; --ink:#1d2430; --muted:#6b7585; --line:#d5d9e0;
  --accent:#0f766e; --accent-soft:#d9f0ec; --warn:#b45309; --warn-soft:#fdecc8; --bad:#b91c1c; --bad-soft:#fde0e0; --ok:#15803d; --ok-soft:#dcf3e2;
}
:root[data-theme="dark"]{
  --bg:#12151a; --surface:#1b2028; --soft:#232a34; --ink:#e8ebf0; --muted:#98a2b3; --line:#3a4350;
  --accent:#4fd1c5; --accent-soft:#16413d; --warn:#f2b45a; --warn-soft:#4a3513; --bad:#f28b8b; --bad-soft:#4a1f1f; --ok:#6fd48e; --ok-soft:#173b24;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151a; --surface:#1b2028; --soft:#232a34; --ink:#e8ebf0; --muted:#98a2b3; --line:#3a4350;
    --accent:#4fd1c5; --accent-soft:#16413d; --warn:#f2b45a; --warn-soft:#4a3513; --bad:#f28b8b; --bad-soft:#4a1f1f; --ok:#6fd48e; --ok-soft:#173b24;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.layout{display:flex;gap:24px;max-width:1080px;margin:0 auto;padding:20px 16px;align-items:flex-start}
.side{width:260px;flex:none;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.side h1{font-size:15px;margin-bottom:2px}
.side p{color:var(--muted);font-size:12px;margin-bottom:10px}
.side h2{font-size:11px;letter-spacing:.04em;color:var(--muted);margin:12px 0 4px;text-transform:uppercase}
.side button{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:6px;font-size:13px}
.side button:hover{background:var(--soft)}
.side button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.theme{margin-top:12px;border:1px solid var(--line)!important;text-align:center!important}
.stage{flex:1;display:flex;justify-content:center}
.phone{width:390px;height:790px;background:var(--surface);border:2px solid var(--ink);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:26px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:11px;color:var(--muted)}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px 10px;border-bottom:1px solid var(--line)}
.top .ttl{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:14px}
.view{flex:1;overflow-y:auto;padding:14px}
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tabbar button{flex:1;padding:9px 2px 11px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button i{font-style:normal;font-size:17px}
.tabbar button.on{color:var(--accent);font-weight:700}
h3{font-size:15px;margin:16px 0 8px}
h3:first-child{margin-top:0}
.sub{color:var(--muted);font-size:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);margin-bottom:10px}
.card.tap{cursor:pointer}
.card.tap:hover{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background-image:linear-gradient(to top right,transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px)),linear-gradient(to bottom right,transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px))}
.ph span{position:absolute;left:6px;bottom:4px;font-size:10px;color:var(--muted);background:var(--surface);padding:0 4px;border-radius:4px}
.ph.sq{aspect-ratio:4/3}
.ph.wide{aspect-ratio:16/10}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;background:var(--surface);white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;flex-wrap:nowrap}
.chips.wrap{flex-wrap:wrap}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-gray{background:var(--soft);color:var(--muted)}
.btn{display:block;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);text-align:center;font-weight:600;background:var(--surface)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:12px}
:root[data-theme="dark"] .btn.pri{color:#06201d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#06201d}}
.fab{position:absolute;right:16px;bottom:78px;width:50px;height:50px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;display:grid;place-items:center;border:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:5px 2px;font-size:11px;border-right:1px solid var(--line);color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button.on.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.seg button.on.warn{background:var(--warn-soft);color:var(--warn);font-weight:700}
.seg button.on.bad{background:var(--bad-soft);color:var(--bad);font-weight:700}
.seg button.on.na{background:var(--soft);color:var(--ink);font-weight:700}
.seg button.on.def{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 -14px 12px;padding:0 14px;overflow-x:auto}
.tabs button{padding:8px 12px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
textarea.input{min-height:90px;resize:vertical}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
table.cmp{width:100%;border-collapse:collapse;font-size:12px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px;text-align:center}
table.cmp td:first-child,table.cmp th:first-child{text-align:left;background:var(--soft);font-weight:600;white-space:nowrap}
table.cmp tr.hl td{background:var(--accent-soft)}
.scroll-x{overflow-x:auto;margin:0 -14px;padding:0 14px}
.hide{display:none!important}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:21px}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;flex:none}
.note{font-size:11px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 10px;margin:10px 0}
.pt{display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.pt.on{border-color:var(--accent);background:var(--accent-soft)}
.pt .ic{font-size:26px;width:40px;text-align:center}
.pt .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
.pt.on .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.dots{display:flex;gap:4px;justify-content:center;margin-top:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.stars{color:var(--warn);letter-spacing:1px}
.chk{width:20px;height:20px;border:2px solid var(--line);border-radius:5px;display:inline-grid;place-items:center;font-size:12px;color:transparent;flex:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:860px){
  .layout{flex-direction:column;padding:10px}
  .side{width:100%;position:static;max-height:none}
  .side .grp{display:flex;flex-wrap:wrap;gap:4px}
  .side button{width:auto;border:1px solid var(--line)}
  .stage{width:100%}
  .phone{width:100%;max-width:420px;height:760px}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="stage">
    <div class="phone">
      <div class="status"><span>9:41</span><span>샘플 화면 · 와이어프레임</span></div>
      <div class="top"><button class="ib" id="back" aria-label="뒤로">‹</button><div class="ttl" id="title"></div><button class="ib" id="homebtn" aria-label="모드 선택">⌂</button></div>
      <div class="view" id="view"></div>
      <nav class="tabbar" id="tabbar"></nav>
    </div>
  </main>
</div>

<script>
// ---------- 데이터 ----------
const TOP10_INSPECT = [
  ['타이어 공기압·마모','월 1회 · 셀프'],['브레이크 (패드·브레이크액)','6개월 · 정비소'],['엔진오일 / 감속기오일','월 1회 · 셀프+정비소'],
  ['냉각수','3개월 · 셀프+정비소'],['12V 배터리','6개월 · 정비소'],['등화장치','월 1회 · 셀프'],
  ['와이퍼·워셔액','월 1회 · 셀프'],['공조장치','6개월 · 셀프+정비소'],['하체·서스펜션·조향','연 1회 · 정비소'],['경고등·진단 (고전압 포함)','상시 · 셀프+정비소']
];
const BLUEHANDS_EXTRA = ['타이어 마모도','브레이크 패드 마모','EV 냉각수·고전압 배터리','변속기오일 ★','에어컨(실내) 필터 ★','구동 벨트 ★'];
const MAINT10 = ['엔진오일·필터','타이어','브레이크패드','12V 배터리','와이퍼','에어컨 필터','에어클리너','브레이크액','냉각수(부동액)','휠 얼라인먼트'];
const BUY_TOP10 = [
  ['예산·총소유비용(TCO)','차량가 외 5년 유지비·보험·세금까지 감당 가능한가?'],
  ['용도·주행 패턴','출퇴근/장거리 비율, 연간 주행거리, 탑승 인원'],
  ['파워트레인 적합성','집·직장 충전 가능? 겨울 주행거리는? (전기차)'],
  ['안전성','NCAP 등급, 충돌 방지·주행보조 사양'],
  ['공간·크기','가족 인원, 트렁크, 주차 가능 여부'],
  ['보조금·세제 혜택·할인','구매 보조금, 취득세 감면, 프로모션'],
  ['트림·옵션 구성','꼭 필요한 사양이 어느 트림부터 포함되나?'],
  ['서비스·보증','정비망 접근성, 배터리 보증 기간·조건'],
  ['감가·잔존가치','중고 시세·감가 추이'],
  ['시승·실사용 후기','승차감, 시야, 소음, 오너 후기']
];

// ---------- 헬퍼 ----------
const ph = (label, cls='sq') => `<div class="ph ${cls}"><span>${label}</span></div>`;
const seg = (opts, on, group, kinds) => `<div class="seg" data-seg="${group}">${opts.map((o,i)=>`<button class="${i===on?'on '+(kinds?kinds[i]:'def'):''}" data-kind="${kinds?kinds[i]:'def'}">${o}</button>`).join('')}</div>`;
const chips = (arr, on=[], wrap=false) => `<div class="chips ${wrap?'wrap':''}">${arr.map((c,i)=>`<button class="chip ${on.includes(i)?'on':''}" data-chip>${c}</button>`).join('')}</div>`;
const stars = n => `<span class="stars">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`;

// ---------- 화면 정의 ----------
const S = {};

S.home = {title:'E-car-manage', tabs:null, group:'공통', label:'모드 선택(홈)', render:()=>`
  <p class="sub">홍길동 가족 · 3명</p>
  <h3>무엇을 할까요?</h3>
  <div class="card tap" data-go="shop-pt" style="padding:18px"><div class="row"><div style="font-size:30px">🔍</div><div class="grow"><b style="font-size:16px">신차 구입</b><div class="sub">취향·유형별 탐색, 비교, 구입 준비 체크</div></div><span>›</span></div></div>
  <div class="card tap" data-go="car-home" style="padding:18px"><div class="row"><div style="font-size:30px">🚗</div><div class="grow"><b style="font-size:16px">차량 관리</b><div class="sub">정비·점검·보험·주행거리·비용</div></div><span>›</span></div></div>
  <h3>다가오는 일정</h3>
  <div class="card"><div class="row sb"><span>보험 만기 · 가족 SUV</span><span class="badge b-bad">D-12</span></div></div>
  <div class="card"><div class="row sb"><span>엔진오일 교체 · 출퇴근 세단</span><span class="badge b-warn">D-30</span></div></div>
  <div class="card"><div class="row sb"><span>월간 셀프 점검 (6/10 완료)</span><span class="badge b-gray">이번 달</span></div></div>`};

// ----- 신차 구입 -----
S['shop-pt'] = {title:'신차 구입', tabs:null, group:'신차 구입', label:'파워트레인 선택', render:()=>`
  <h3 style="font-size:18px">어떤 차를 알아볼까요?</h3>
  <p class="sub" style="margin-bottom:12px">여러 개 선택할 수 있어요. 나중에 언제든 바꿀 수 있어요.</p>
  <div class="pt on" data-pt><div class="ic">⚡</div><div class="grow"><b>전기차</b><div class="sub">충전해서 타요 · 보조금·충전 환경 확인</div></div><div class="ck">✓</div></div>
  <div class="pt" data-pt><div class="ic">🔋</div><div class="grow"><b>하이브리드</b><div class="sub">HEV(충전 불필요) / PHEV(충전+주유)</div>${chips(['HEV','PHEV'],[],true)}</div><div class="ck">✓</div></div>
  <div class="pt" data-pt><div class="ic">⛽</div><div class="grow"><b>내연기관</b><div class="sub">휘발유 · 디젤 · LPG</div></div><div class="ck">✓</div></div>
  <div class="pt" data-pt><div class="ic">❓</div><div class="grow"><b>아직 못 정했어요</b><div class="sub">3가지 모두 보고 비교할래요</div></div><div class="ck">✓</div></div>
  <button class="btn pri" data-go="shop-explore" style="margin-top:6px">다음</button>
  <p class="note">"아직 못 정했어요"를 고르면 탐색 홈에 <b>유형 비교 가이드</b>(질문 3~4개 → 어울리는 유형 추천)가 나타납니다.</p>`};

S['shop-explore'] = {title:'탐색', tabs:'shop', tab:0, group:'신차 구입', label:'탐색 홈', render:()=>`
  <div class="row" style="margin-bottom:8px"><div class="chips grow"><button class="chip on" data-go="shop-pt">⚡ 전기차 ✕</button><button class="chip" data-go="shop-pt">+ 유형 추가</button></div></div>
  <div class="card" style="background:var(--accent-soft);border-color:var(--accent)"><b>취향 요약</b><div class="sub">예산 4,000~5,500만 · SUV · 주행보조 중요</div><button class="btn sm" style="margin-top:6px" data-go="shop-pt">취향 설정</button></div>
  <div class="card tap" data-go="shop-budget"><div class="row sb"><span>💰 <b>예산으로 추천받기</b><div class="sub">예산을 넣으면 인기 TOP 10 모델을 보여 줘요</div></span><span>›</span></div></div>
  <h3>브랜드</h3>
  <div class="chips">${['전체','브랜드 A','브랜드 B','브랜드 C','브랜드 D','브랜드 E'].map((b,i)=>`<button class="chip ${i===0?'on':''}" data-chip-one>${b}</button>`).join('')}</div>
  <div class="row sb"><h3>추천 / 최근 본</h3><button class="chip" data-go="shop-add">+ 차량 추가</button></div>
  <div class="grid2">
    ${[['모델 A1','전기 SUV','5,000만~'],['모델 A2','전기 세단','4,600만~'],['모델 B1','전기 SUV','5,400만~'],['모델 C1','전기 해치백','3,900만~']].map(m=>`
    <div class="card tap" style="padding:8px" data-go="shop-model">${ph('대표 이미지')}<b style="display:block;margin-top:6px">${m[0]}</b><div class="sub">${m[1]} · ${m[2]}</div></div>`).join('')}
  </div>
  <p class="note">모든 금액·사양은 샘플입니다. 실제 앱에서는 가족이 입력·저장한 데이터가 표시됩니다.</p>`};

S['shop-model'] = {title:'모델 A1', tabs:'shop', tab:0, group:'신차 구입', label:'모델 상세(이미지 갤러리)', render:()=>`
  ${ph('이미지 갤러리 (스와이프)','wide')}
  <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i></div>
  <div class="chips" style="margin-top:8px">${['외관','내부','실내공간','휠·디테일'].map((k,i)=>`<button class="chip ${i===0?'on':''}" data-chip-one>${k}</button>`).join('')}<button class="chip" data-go="shop-add">+ 이미지 추가</button></div>
  <div class="row sb" style="margin-top:10px"><div><b style="font-size:17px">모델 A1</b> <span class="badge b-ok">전기차</span><div class="sub">브랜드 A · 전기 SUV</div></div><b>5,000만~</b></div>
  <h3>트림</h3>
  <div class="seg" data-seg="trim"><button class="on def">스탠다드</button><button data-kind="def">롱레인지</button><button data-kind="def">프레스티지</button></div>
  <h3>주요 사양 <span class="sub">(전기차 기준)</span></h3>

// ---------- 탭바 ----------
const TABS = {
  shop:[['🔍','탐색','shop-explore'],['⇄','비교','shop-compare'],['♡','관심','shop-wish'],['✅','구입 준비','shop-prep'],['⋯','더보기','more']],
  car:[['🏠','홈','car-home'],['🚗','내 차','car-list'],['📅','일정','car-schedule'],['💰','비용','car-cost'],['⋯','더보기','more']]
};
let lastMode = 'shop', current = 'home', navStack = [];

function go(id, push=true){
  if(!S[id]) id='home';
  if(push && current !== id) navStack.push(current);
  current = id;
  const s = S[id];
  if(s.tabs==='shop'||s.tabs==='car') lastMode = s.tabs;
  const mode = s.tabs==='auto' ? lastMode : s.tabs;
  document.getElementById('title').textContent = s.title;
  const v = document.getElementById('view');
  v.innerHTML = s.render();
  v.scrollTop = 0;
  const tb = document.getElementById('tabbar');
  if(mode){
    tb.classList.remove('hide');
    tb.innerHTML = TABS[mode].map(t=>`<button class="${(s.tabs!=='auto' && t[2]===('shop-explore,shop-compare,shop-wish,shop-prep'.includes(id)?id:TABS[mode][s.tab][2])) || (s.tabs==='auto' && t[2]==='more')?'on':''}" data-go="${t[2]}"><i>${t[0]}</i>${t[1]}</button>`).join('');
  } else { tb.classList.add('hide'); tb.innerHTML=''; }
  document.querySelectorAll('#side [data-nav]').forEach(b=>b.classList.toggle('on', b.dataset.nav===id));
  try{ location.hash = id; }catch(e){}
}

// ---------- 사이드 목록 ----------
(function buildSide(){
  const groups = {};
  Object.keys(S).forEach(id=>{ (groups[S[id].group] = groups[S[id].group]||[]).push(id); });
  let h = `<h1>E-car-manage</h1><p>화면 와이어프레임 (샘플 데이터)</p>`;
  Object.keys(groups).forEach(g=>{
    h += `<h2>${g}</h2><div class="grp">` + groups[g].map(id=>`<button data-nav="${id}">${S[id].label}</button>`).join('') + `</div>`;
  });
  h += `<button class="theme" id="theme">🌓 라이트/다크 전환</button>`;
  document.getElementById('side').innerHTML = h;
})();

// ---------- 이벤트 ----------
document.addEventListener('click', e=>{
  const t = e.target;
  const nav = t.closest('[data-nav]'); if(nav){ navStack=[]; go(nav.dataset.nav); return; }
  if(t.closest('#theme')){ const r=document.documentElement; r.dataset.theme = (r.dataset.theme==='dark'||(!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches))?'light':'dark'; return; }
  if(t.closest('#back')){ const p=navStack.pop(); go(p||'home', false); return; }
  if(t.closest('#homebtn')){ navStack=[]; go('home'); return; }

  const seg = t.closest('.seg button');
  if(seg){
    const group = seg.parentElement;
    group.querySelectorAll('button').forEach(b=>b.className='');
    seg.className = 'on ' + (seg.dataset.kind || 'def');
    if(seg.dataset.imgtab){ document.getElementById('img-up').classList.toggle('hide', seg.dataset.imgtab!=='up'); document.getElementById('img-url').classList.toggle('hide', seg.dataset.imgtab!=='url'); }
    updateInsp(); updateBuy(); return;
  }
  const tabBtn = t.closest('[data-tabs] button');
  if(tabBtn){
    const wrap = tabBtn.parentElement, key = wrap.dataset.tabs;
    wrap.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===tabBtn));
    document.querySelectorAll(`[data-panel^="${key}-"]`).forEach(p=>p.classList.toggle('hide', p.dataset.panel!==`${key}-${tabBtn.dataset.t}`));
    return;
  }
  const pt = t.closest('[data-pt]');
  if(pt && !t.closest('.chip')){ pt.classList.toggle('on'); return; }
  const chipOne = t.closest('[data-chip-one]');
  if(chipOne){ chipOne.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); chipOne.classList.add('on'); return; }
  const chip = t.closest('[data-chip]');
  if(chip && !chip.dataset.go){ chip.classList.toggle('on'); return; }
  const rev = t.closest('[data-reveal]'); if(rev){ document.getElementById(rev.dataset.reveal).classList.remove('hide'); return; }
  const self = t.closest('[data-self]');
  if(self){ self.querySelector('.chk').classList.toggle('on'); updateSelf(); return; }
  if(t.closest('[data-allok]')){
    document.querySelectorAll('#view .seg').forEach(g=>{ g.querySelectorAll('button').forEach((b,i)=>{ b.className = i===0 ? 'on '+b.dataset.kind : ''; }); });
    updateInsp(); return;
  }
  const sw = t.closest('[data-sw]'); if(sw){ sw.classList.toggle('on'); return; }
  const g = t.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
});

function updateInsp(){
  const el = document.getElementById('insp-prog'); if(!el) return;
  let ok=0,warn=0,bad=0;
  document.querySelectorAll('#view .card .seg').forEach((g,i)=>{ if(i>=10) return; const on=g.querySelector('button.on'); if(!on) return; const k=on.dataset.kind; if(k==='ok')ok++; else if(k==='warn')warn++; else if(k==='bad')bad++; });
  el.textContent = `정상 ${ok} · 주의 ${warn} · 교체 ${bad}`;
  el.className = 'badge ' + (bad?'b-bad':warn?'b-warn':'b-ok');
}
function updateBuy(){
  const p = document.getElementById('buy-prog'); if(!p) return;
  const cards = document.querySelectorAll('[data-buy]'); let ok=0, bad=0;
  cards.forEach(c=>{ const on=c.querySelector('.seg button.on'); if(on&&on.dataset.kind==='ok')ok++; if(on&&on.dataset.kind==='bad')bad++; });
  p.textContent = `${ok} / 10 확인` + (bad?` · 문제 ${bad}`:'');
  p.className = 'badge ' + (bad?'b-warn':'b-ok');
  document.getElementById('buy-bar').style.width = ok*10+'%';
}
function updateSelf(){
  const n = document.querySelectorAll('[data-self] .chk.on').length;
  document.getElementById('self-prog').textContent = `${n} / 6`;
  document.getElementById('self-bar').style.width = (n/6*100)+'%';
}

// 시작
go((location.hash||'').replace('#','') || 'home', false);
</script>
</body>
</html>
